plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kk.jsbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kk.jsbrowser'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.3.1'
    }

    // Stable release signing: never use the ephemeral CI debug key for distributed APKs.
    // The encrypted PKCS12 signing key is restored by GitHub Actions into RUNNER_TEMP.
    def stableStorePath = System.getenv('JSLITE_STORE_FILE')
    def stableStorePassword = System.getenv('JSLITE_STORE_PASSWORD')

    signingConfigs {
        stable {
            if (stableStorePath && stableStorePassword) {
                storeFile file(stableStorePath)
                storePassword stableStorePassword
                keyAlias 'jslite-browser'
                keyPassword stableStorePassword
                storeType 'pkcs12'
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'packageRelease' } &&
                (!stableStorePath || !stableStorePassword)) {
            throw new GradleException(
                'Stable signing configuration missing. Refusing to build an unsigned/ephemeral release APK.')
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
