plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kk.jsbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kk.jsbrowser'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.2.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
