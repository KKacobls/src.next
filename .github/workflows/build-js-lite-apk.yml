name: Build JS Lite Browser v1.2.0 APK
on:
  push:
    branches: [js-lite-browser-build]
    paths:
      - 'js-lite-browser/**'
      - '.github/workflows/build-js-lite-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug APK
        working-directory: js-lite-browser
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Check generated APK
        run: |
          test -s js-lite-browser/app/build/outputs/apk/debug/app-debug.apk
          cp js-lite-browser/app/build/outputs/apk/debug/app-debug.apk JS-Lite-Browser-v1.2.0.apk
          sha256sum JS-Lite-Browser-v1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JS-Lite-Browser-v1.2.0-APK
          path: JS-Lite-Browser-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: js-lite-browser-v1.2.0
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" JS-Lite-Browser-v1.2.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" JS-Lite-Browser-v1.2.0.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "JS Lite Browser v1.2.0 Android APK" \
              --notes "History, most recently closed URL, find in page, zoom, mobile/desktop, DOM source, developer-mode unlocking, UI themes and JSON import/export. Android 8+. Debug build." \
              --prerelease
          fi
