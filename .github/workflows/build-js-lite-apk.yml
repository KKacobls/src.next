name: Build JS Lite Browser v1.1.2 APK
on:
  push:
    branches: [js-lite-browser-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android source
        run: |
          base64 -d assets/js-lite-browser-src.tar.xz.b64 > /tmp/js-lite-browser-src.tar.xz
          echo "6f4886e65693450b97b84bc941eb0ab33bfd3bad358e84458dc2d162f9a891c5  /tmp/js-lite-browser-src.tar.xz" | sha256sum -c -
          mkdir -p js-lite-browser
          tar -xJf /tmp/js-lite-browser-src.tar.xz -C js-lite-browser
      - name: Apply v1.1 upgrade
        run: |
          base64 -d assets/js-lite-v11.patch.xz.b64 > /tmp/js-lite-v11.patch.xz
          echo "e413652b608c34cdcf5c003e3c49a5bc785528c0ac9929737db913b7f6edc400  /tmp/js-lite-v11.patch.xz" | sha256sum -c -
          xz -dc /tmp/js-lite-v11.patch.xz | sed '/^--- a\/README.md$/,$d' > /tmp/js-lite-v11.patch
          (cd js-lite-browser && patch --batch -p1 < /tmp/js-lite-v11.patch)
      - name: Apply v1.1.2 address editor and Traditional Chinese default
        run: (cd js-lite-browser && patch --batch -p1 < ../assets/js-lite-v111.patch)
      - name: Apply v1.1.2 overflow menu and native dialog styling
        run: |
          base64 -d assets/js-lite-v112.patch.xz.b64 > /tmp/js-lite-v112.patch.xz
          echo "56ae7bd50714324e44f18a4e17f5ab2e7022f6dee37f309570c136e0429aeb79  /tmp/js-lite-v112.patch.xz" | sha256sum -c -
          (cd js-lite-browser && xz -dc /tmp/js-lite-v112.patch.xz | patch --batch -p1)
      - name: Build Android APK
        working-directory: js-lite-browser
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare APK file
        run: cp js-lite-browser/app/build/outputs/apk/debug/app-debug.apk JS-Lite-Browser-v1.1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JS-Lite-Browser-v1.1.2-APK
          path: JS-Lite-Browser-v1.1.2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: js-lite-browser-v1.1.2
        run: |
          set -e
          apk="JS-Lite-Browser-v1.1.2.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$apk" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "JS Lite Browser v1.1.2 (Android Debug APK)" \
              --notes "Updated LINE-style header: title and domain left, overflow menu ⋮ and close × right. URL editing, auto JS, console, language, layout, and version number moved under ⋮. Android-native dialog typography for JavaScript alert/confirm; green confirm button. Website CSS unchanged. Existing scripts are retained if Android allows an in-place upgrade. Android 8+. Personal testing/debug signing: uninstall earlier builds if Android reports a signature conflict." \
              --prerelease
          fi
